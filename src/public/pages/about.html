<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/1.0.0/modern-normalize.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@800&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <title>Our team</title>
</head>
<body>
    <header class="page-header">
        <div class="container mobile-header">
            <a href="/" class="logo">
                <span>Roflo-team</span>
            </a>
        
            <button type="button" class="menu-open-btn" aria-expanded="false" aria-controls="mobile-menu">
                <svg class="menu-icon" viewBox="0 0 32 22">
                    <use href="../images/icons.svg#icon-adid"></use>
                </svg>
            </button>
        </div>
    
        <div class="container header-container desktop-header">
            <a href="/" class="logo">
                <span>Roflo-team</span>
            </a>
        
            <nav class="navigation">
                <ul class="nav-list">
                    <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="/about" class="nav-link">About us</a></li>
                    <li class="nav-item"><a href="/team" class="nav-link">Team</a></li>
                </ul>
            </nav>
        
            <div class="contacts">
                <ul class="contacts-list">
                    <li class="contacts-item"><a href="mailto:info@team.com" class="contact-link">info@team.com</a></li>
                    <li class="contacts-item"><a href="https://github.com/" target="_blank" class="contact-link external">GitHub
                            Project</a></li>
                </ul>
            </div>
        </div>

        <div class="mobile-menu" id="mobile-menu">
            <div class="mobile-menu-container">
        
                <button type="button" class="menu-close-btn">
                    <svg class="close-icon" width="32" height="32">
                        <use href="../images/icons.svg#icon-close-mobile"></use>
                    </svg>
                </button>
        
                <nav class="mobile-navigation">
                    <ul class="mobile-nav-list">
                        <li><a href="/" class="nav-link">Home</a></li>
                        <li><a href="/about" class="nav-link">About us</a></li>
                        <li><a href="/team" class="nav-link">Team</a></li>
                    </ul>
                </nav>
        
                <div class="mobile-contacts">
                    <ul class="mobile-contacts-list">
                        <li><a href="mailto:info@team.com" class="contact-link">info@team.com</a></li>
                        <li><a href="https://github.com/" target="_blank" class="contact-link external">GitHub Project</a></li>
                    </ul>
                </div>
        
            </div>
        </div>
    </header>
    <main>
        <section class="section-hero"></section>
        <section class="section-about"></section>
        <section class="section-team"></section>
    </main>
    <footer>
    </footer>
    <script>
        const menu = document.getElementById("mobile-menu");
        const openBtn = document.querySelector(".menu-open-btn");
        const closeBtn = document.querySelector(".menu-close-btn");

        openBtn.addEventListener("click", () => {
            menu.classList.add("is-open");
        });

        closeBtn.addEventListener("click", () => {
            menu.classList.remove("is-open");
        });
    </script>
</body>
</html>
